# GitHub Pages: מפרסם את החזית הסטטית בלבד (web/). אין כאן מפתחות ואין שרת: הדף שמתפרסם מזהה שהוא לא רץ מול
# 127.0.0.1 ומציג את ההודעה „הדף נפתח בלי השרת” עם ההנחיה להפעיל את Content Studio.bat (web/app.js, loadHealth).
# הכתובת: https://<username>.github.io/<repo>/ · ההפעלה: Settings → Pages → Source: GitHub Actions.
name: Pages (static frontend)

on:
  push:
    branches: [main]
    paths: ["web/**", ".github/workflows/pages.yml"]
  workflow_dispatch:

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - uses: actions/checkout@v4
      - name: Assemble the static site (index at the root, assets under static/, same layout the local server uses)
        run: |
          mkdir -p site/static
          cp web/index.html site/index.html
          cp web/app.js web/styles.css web/favicon.svg site/static/
          touch site/.nojekyll
      - uses: actions/configure-pages@v5
      - uses: actions/upload-pages-artifact@v3
        with:
          path: site
      - id: deployment
        uses: actions/deploy-pages@v4
